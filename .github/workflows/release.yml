name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Tests must pass before anything ships
        run: npm test

      - name: Restore the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
            echo "signed=real" >> "$GITHUB_OUTPUT"
          else
            echo "signed=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'ci-ephemeral' }}
        run: |
          set -e
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          mkdir -p android/sdk
          cp "$ANDROID_HOME/platforms/android-34/android.jar" android/sdk/android.jar
          cd android && ./build.sh

      - name: Release notes
        run: |
          {
            echo "Install on Android: download \`logbook-solo.apk\` and open it."
            echo
            if [ "${{ steps.key.outputs.signed }}" = "real" ]; then
              echo "Signed with the project key, so it installs over a previous version."
            else
              echo "> **Signed with a throwaway CI key.** It will not install over an"
              echo "> existing copy — uninstall first, or add \`KEYSTORE_BASE64\` and"
              echo "> \`KEYSTORE_PASS\` as repository secrets so releases are signed properly."
            fi
          } > NOTES.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: android/logbook-solo.apk
          body_path: NOTES.md
          generate_release_notes: true

      - name: Never leave a key on the runner
        if: always()
        run: rm -f android/keystore.jks
