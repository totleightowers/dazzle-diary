# The app itself has no dependencies — nothing is installed at build or run
# time, which is the point. So Dependabot's job here is the CI supply chain:
# the actions this repo trusts to build and sign an APK.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
